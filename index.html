<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameTopup Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#07131f;color:#fff;overflow-x:hidden}
.navbar{height:66px;background:#0d2233;display:flex;justify-content:space-between;align-items:center;padding:0 16px;position:sticky;top:0;z-index:1000;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.left,.right{display:flex;align-items:center;gap:14px}.logo{font-size:24px;font-weight:800;color:#57f2ff}.icon{font-size:23px}
.btn{background:#00c2a8;border:none;color:#fff;padding:10px 20px;border-radius:20px;font-weight:700;cursor:pointer}
.hero{padding:10px}.slider{position:relative;border-radius:14px;overflow:hidden;height:220px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.slides{display:flex;width:300%;height:100%;transition:transform .6s ease}.slide{width:100%;flex-shrink:0;position:relative}
.slide img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,40,61,.88),rgba(0,0,0,.1))}
.banner-content{position:absolute;left:18px;top:26px;max-width:45%;z-index:2}.banner-content h1{font-size:32px;font-weight:800;line-height:1;margin-bottom:10px}
.banner-content p{font-size:13px;line-height:1.5;margin-bottom:14px}.banner-btn{display:inline-block;background:#57f2ff;color:#001219;padding:9px 15px;border-radius:20px;font-weight:700;font-size:12px}
.dots{display:flex;justify-content:center;gap:8px;padding:16px 0 24px}.dot{width:10px;height:10px;border-radius:50%;background:#3a596d;transition:.3s}.dot.active{background:#57f2ff;width:24px;border-radius:20px}
.install{margin:0 16px 30px;background:#10293c;color:#fff;border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center}.install-icon{width:60px;height:60px;background:#00c2a8;border-radius:18px}
.install span{color:#57f2ff;font-weight:700}.section-title{font-size:44px;font-weight:800;padding:0 18px;margin-bottom:18px;letter-spacing:2px;color:#57f2ff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 14px 40px}.card{background:#10293c;border-radius:18px;overflow:hidden;transition:.25s}
.card img{width:100%;height:170px;object-fit:cover}.card-title{padding:14px 10px 18px;text-align:center;font-size:14px;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;padding:20px;z-index:9999}
.modal-box{background:#10293c;width:100%;max-width:420px;border-radius:24px;padding:24px;color:#fff;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:28px;font-weight:800;margin-bottom:6px;color:#57f2ff}.modal-sub{font-size:14px;color:#b6d8e4;margin-bottom:20px}
.input{width:100%;padding:14px 16px;border:2px solid #28485d;background:#0d2233;color:#fff;border-radius:14px;margin-bottom:14px;font-size:15px;outline:none}
.input:focus{border-color:#57f2ff}.captcha{background:#0d2233;padding:14px;border-radius:14px;margin-bottom:14px;font-weight:700;color:#c6faff}
.submit-btn{width:100%;padding:14px;border:none;background:#00c2a8;color:#fff;border-radius:16px;font-size:16px;font-weight:700}
.switch{text-align:center;margin-top:14px;color:#b6d8e4}.switch span{color:#57f2ff;font-weight:700;cursor:pointer}.close{position:absolute;right:18px;top:16px;font-size:24px;color:#c6faff;cursor:pointer}
.modal-wrap{position:relative}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.section-title{font-size:36px}.banner-content h1{font-size:28px}}
</style></head><body></body></html>
